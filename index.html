<!doctype html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🤖•YAHYA•§.16</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#000;color:#eee;font-family:system-ui}#app{height:100dvh;display:flex;flex-direction:column}header{padding:16px;border-bottom:1px solid #222;display:flex;justify-content:space-between}.brand{font-weight:700}.panel{flex:1;display:flex;flex-direction:column;min-height:0}#messages{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}.msg{max-width:88%;padding:11px 14px;border-radius:13px;white-space:pre-wrap;line-height:1.5}.ai{background:#0b0b0b;border:1px solid #222}.user{align-self:flex-end;background:#fff;color:#000}#status{padding:0 16px;color:#888;font-size:12px;min-height:22px}footer{padding:10px 14px 18px;border-top:1px solid #222}.tools{display:flex;gap:7px;margin-bottom:8px;overflow:auto}.tool{background:#0a0a0a;color:#ddd;border:1px solid #333;border-radius:9px;padding:7px 10px}.row{display:flex;gap:8px;background:#0a0a0a;border:1px solid #333;border-radius:12px;padding:7px 7px 7px 12px}#q{flex:1;background:none;border:0;outline:0;color:#fff;min-width:0}#send{border:0;border-radius:8px;padding:9px 15px}.modal{display:none;position:fixed;inset:0;background:#000d;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.box{width:min(800px,100%);background:#090909;border:1px solid #333;border-radius:15px;padding:15px}video{width:100%;background:#000;border-radius:10px}.btn{background:#111;color:#fff;border:1px solid #333;border-radius:8px;padding:9px;margin-top:8px}</style></head><body><div id="app"><header><div class="brand">🤖•YAHYA•§.16</div><button onclick="newChat()">＋</button></header><div class="panel"><div id="messages"><div class="msg ai">🤖 MERHABA! BEN •YAHYA•§.16. Sana kod yazabilir, dosyaları inceleyebilir ve yeni özelliklerle genişleyebilirim. 😊</div></div><div id="status"></div><footer><div class="tools"><button class="tool" onclick="file.click()">📎 Dosya</button><button class="tool" onclick="voice()">🎙 Ses</button><button class="tool" onclick="live()">📹 Canlı</button><button class="tool" onclick="newChat()">＋ Yeni</button></div><div class="row"><input id="q" placeholder="Sorunuzu yazın..."><button id="send" onclick="ask()">Gönder</button></div></footer></div></div><input id="file" type="file" multiple><div id="modal" class="modal"><div class="box"><video id="video" autoplay playsinline></video><button class="btn" onclick="stopLive()">Durdur</button><button class="btn" onclick="modal.classList.remove('open')">Kapat</button></div></div><script>const $=x=>document.getElementById(x),q=$("q"),messages=$("messages"),status=$("status");let history=[],stream;function add(t,u=false){let d=document.createElement("div");d.className="msg "+(u?"user":"ai");d.textContent=t;messages.appendChild(d);messages.scrollTop=messages.scrollHeight}function newChat(){history=[];messages.innerHTML="";add("🤖 Yeni sohbet hazır.")}async function ask(){let t=q.value.trim();if(!t)return;add(t,true);history.push({role:"user",content:t});q.value="";$("send").disabled=true;status.textContent="Yanıt hazırlanıyor…";try{let r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:history})}),d=await r.json();if(!r.ok)throw Error(d.error||"API hatası");add(d.text||"Yanıt alınamadı.");history.push({role:"assistant",content:d.text||""})}catch(e){add("⚠️ "+e.message)}finally{$("send").disabled=false;status.textContent=""}}q.onkeydown=e=>{if(e.key==="Enter")ask()};file.onchange=e=>[...e.target.files].forEach(f=>add("📎 "+f.name+" seçildi.",true));function voice(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return add("Bu tarayıcı sesli yazmayı desteklemiyor.");let r=new R();r.lang="tr-TR";r.onresult=e=>q.value=e.results[0][0].transcript;r.start()}async function live(){try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});video.srcObject=stream;modal.classList.add("open")}catch(e){add("⚠️ Kamera/mikrofon izni alınamadı.")}}function stopLive(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null}</script></body></html>
